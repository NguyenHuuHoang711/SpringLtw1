<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Yêu cầu mở lớp</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap4.min.css">
  <!-- AdminLTE css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <!-- Left navbar links -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="/admin" class="nav-link">Trang chủ</a>
      </li>
    </ul>

    <!-- Right navbar links -->
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/admin" class="brand-link">
      <span class="brand-text font-weight-light ml-3">Hệ thống Đào tạo</span>
    </a>

    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <i class="fas fa-user-circle fa-2x text-white"></i>
        </div>
        <div class="info">
          <a href="#" class="d-block">Quản trị viên</a>
        </div>
      </div>

      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="/admin" class="nav-link">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Tổng quan</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/admin/requests" class="nav-link active">
              <i class="nav-icon fas fa-envelope-open-text"></i>
              <p>Yêu cầu mở lớp</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Quản lý Yêu cầu mở lớp</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">

        <div id="alertBox" class="alert d-none"></div>

        <div class="card card-primary card-outline">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-list"></i> Danh sách nhóm yêu cầu (Cần >= 5 để duyệt)</h3>
          </div>
          <div class="card-body">
            <table id="requestsTable" class="table table-bordered table-striped table-hover">
              <thead>
              <tr>
                <th>Mã Môn</th>
                <th>Tên Môn</th>
                <th>Số lượng yêu cầu</th>
                <th>Hành động</th>
              </tr>
              </thead>
              <tbody id="reqBody">
                <tr><td colspan="4" class="text-center text-muted">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer class="main-footer">
    <strong>Copyright &copy; 2024.</strong> Đã đăng ký bản quyền.
  </footer>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- DataTables & Plugins -->
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script>
    const role = localStorage.getItem('fake_user_role');
    if (role !== 'admin') window.location.href = '/';

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }

    function showAlert(msg, type='success') {
        const b = document.getElementById('alertBox');
        b.className = `alert alert-${type}`;
        b.textContent = msg;
        b.classList.remove('d-none');
        setTimeout(() => b.classList.add('d-none'), 3000);
    }

    let groups = [];
    async function loadStats() {
        const res = await fetch('/api/registration/requests/admin/pending');
        const data = await res.json();

        let map = {};
        (data.data || []).forEach(req => {
            if(!map[req.courseId]) {
                map[req.courseId] = { courseCode: req.courseCode, courseName: req.courseName, count: 0 };
            }
            map[req.courseId].count++;
        });

        groups = Object.keys(map).map(k => ({ courseId: k, ...map[k] }));

        const body = document.getElementById('reqBody');
        if(!groups.length) {
            body.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Không có yêu cầu nào đang chờ.</td></tr>';
            if ($.fn.DataTable.isDataTable('#requestsTable')) {
                $('#requestsTable').DataTable().destroy();
            }
            return;
        }

        if ($.fn.DataTable.isDataTable('#requestsTable')) {
            $('#requestsTable').DataTable().destroy();
        }

        body.innerHTML = groups.map(g => {
            let btnClass = g.count >= 5 ? 'btn-success' : 'btn-secondary disabled';
            let title = g.count >= 5 ? 'Mở lớp ngay' : 'Chưa đủ số lượng';
            return `
                <tr>
                    <td><strong>${g.courseCode}</strong></td>
                    <td>${g.courseName}</td>
                    <td>
                        <span class="badge ${g.count >= 5 ? 'badge-success' : 'badge-warning'} px-2 py-1" style="font-size: 14px;">
                            <i class="fas fa-users"></i> ${g.count} sinh viên
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm ${btnClass}" ${g.count < 5 ? 'disabled' : ''} onclick="approveCourse('${g.courseId}')">
                            <i class="fas fa-check-circle"></i> ${title}
                        </button>
                    </td>
                </tr>
            `;
        }).join('');

        $('#requestsTable').DataTable({
            "responsive": true,
            "lengthChange": false,
            "autoWidth": false,
            "language": {
                "search": "Tìm kiếm:",
                "info": "Đang hiển thị _START_ đến _END_ trong tổng số _TOTAL_ kết quả",
                "paginate": { "first": "Đầu", "last": "Cuối", "next": "Trang sau", "previous": "Trang trước" }
            }
        });
    }

    async function approveCourse(cId) {
        if(!confirm('Bạn có chắc muốn MỞ LỚP cho môn này?')) return;
        const res = await fetch(`/api/registration/requests/admin/approve-by-course?courseId=${cId}`, { method:'PATCH' });
        const data = await res.json();
        if(res.ok && data.success) {
            showAlert('Đã duyệt mở lớp thành công!', 'success');
            loadStats();
        } else {
            showAlert(data.message || 'Duyệt thất bại!', 'danger');
        }
    }

    loadStats();
</script>
</body>
</html>
