<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử Yêu cầu</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- AdminLTE css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <!-- Left navbar links -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="/student" class="nav-link">Trang chủ</a>
      </li>
    </ul>

    <!-- Right navbar links -->
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/student" class="brand-link">
      <span class="brand-text font-weight-light ml-3">Hệ thống Đào tạo</span>
    </a>

    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <i class="fas fa-user-graduate fa-2x text-white"></i>
        </div>
        <div class="info">
          <a href="#" class="d-block" id="sidebarUserName">Sinh viên</a>
        </div>
      </div>

      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="/student" class="nav-link">
              <i class="nav-icon fas fa-home"></i>
              <p>Tổng quan</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/student/focus-courses" class="nav-link">
              <i class="nav-icon fas fa-exclamation-circle"></i>
              <p>Môn Rớt / Cải thiện</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/student/all-courses" class="nav-link">
              <i class="nav-icon fas fa-book"></i>
              <p>Đăng ký môn học</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/student/payment" class="nav-link">
              <i class="nav-icon fas fa-wallet"></i>
              <p>Thanh toán</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/student/requests" class="nav-link active">
              <i class="nav-icon fas fa-history"></i>
              <p>Lịch sử Yêu cầu</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Lịch sử Yêu cầu mở lớp</h1>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div id="alertBox" class="alert d-none"></div>

        <div class="card card-primary card-outline">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-list-ul"></i> Các yêu cầu đã gửi</h3>
          </div>
          <div class="card-body p-0">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Mã Môn</th>
                  <th>Tên Môn</th>
                  <th>Lý do</th>
                  <th>Trạng thái</th>
                  <th>Ngày gửi</th>
                </tr>
              </thead>
              <tbody id="reqBody">
                <tr><td colspan="5" class="text-center text-muted py-3">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </section>
  </div>

  <footer class="main-footer">
    <strong>Copyright &copy; 2024.</strong> Đã đăng ký bản quyền.
  </footer>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script>
    const API = '/api/registration/requests';
    const userId = localStorage.getItem('fake_user_id');
    const role = localStorage.getItem('fake_user_role');

    if (!userId || role !== 'student') window.location.href = '/';
    document.getElementById('sidebarUserName').innerText = "MSSV: " + userId.substring(0, 8);

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }

    function shortText(value) {
        if (!value) return '—';
        const s = String(value);
        return s.length > 12 ? s.substring(0, 12) + '...' : s;
    }

    function renderStatus(status) {
        if (status === 'PENDING') return '<span class="badge badge-warning">Chờ xử lý</span>';
        if (status === 'APPROVED') return '<span class="badge badge-success">Đã duyệt</span>';
        if (status === 'REJECTED') return '<span class="badge badge-danger">Từ chối</span>';
        return `<span class="badge badge-secondary">${status || 'N/A'}</span>`;
    }

    async function loadData() {
         const body = document.getElementById('reqBody');
         try {
             // Debug info
             console.log('Loading requests for userId:', userId);
             console.log('API URL:', `${API}/me?student_id=${userId}`);

             if (!userId) {
                 body.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-warning">Vui lòng đăng nhập lại.</td></tr>';
                 return;
             }

             const fullUrl = `${API}/me?student_id=${userId}`;
             const res = await fetch(fullUrl);

             console.log('Response status:', res.status);

             if (!res.ok) {
                 throw new Error(`HTTP error! status: ${res.status}`);
             }

             const data = await res.json();
             console.log('Response data:', data);

             if(!data.success) {
                 body.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-danger">API trả về lỗi: ' + (data.message || 'Unknown error') + '</td></tr>';
                 return;
             }

             if(!data.data || !data.data.length) {
                 body.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Bạn chưa gửi yêu cầu nào.</td></tr>';
                 return;
             }

             body.innerHTML = data.data.map(r => {
                 const courseCode = r.desiredCourseId ? shortText(r.desiredCourseId) : '—';
                 const courseName = r.desiredCourseName || '—';
                 const date = r.createdAt ? new Date(r.createdAt).toLocaleString('vi-VN') : '—';

                 return `
                     <tr>
                         <td><strong title="${r.desiredCourseId || ''}">${courseCode}</strong></td>
                         <td>${courseName}</td>
                         <td>${r.reason || ''}</td>
                         <td>${renderStatus(r.status)}</td>
                         <td>${date}</td>
                     </tr>
                 `;
             }).join('');
         } catch (err) {
             console.error('Failed to load request history:', err);
             body.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-danger">Không tải được danh sách yêu cầu: ' + err.message + '</td></tr>';
         }
     }

     // Load data when page ready
     document.addEventListener('DOMContentLoaded', function() {
         loadData();
     });
</script>
</body>
</html>
