<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đào tạo - Login</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- AdminLTE css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <a href="#"><b>Hệ thống</b> Đào tạo</a>
  </div>
  <!-- /.login-logo -->
  <div class="card card-outline card-primary">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Đăng nhập để bắt đầu phiên làm việc</p>

      <div class="input-group mb-3">
        <select id="userRole" class="form-control" onchange="autoFill()">
            <option value="student">Đăng nhập là: Sinh viên</option>
            <option value="admin">Đăng nhập là: Admin</option>
        </select>
        <div class="input-group-append">
          <div class="input-group-text">
            <span class="fas fa-users"></span>
          </div>
        </div>
      </div>

      <div class="input-group mb-3">
        <input type="text" class="form-control" id="userId" placeholder="ID hoặc Mã số">
        <div class="input-group-append">
          <div class="input-group-text">
            <span class="fas fa-id-card"></span>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-8">
          <div class="icheck-primary">
            <input type="checkbox" id="remember">
            <label for="remember">
              Nhớ mật khẩu
            </label>
          </div>
        </div>
        <!-- /.col -->
        <div class="col-4">
          <button type="button" class="btn btn-primary btn-block" onclick="login()">Đăng nhập</button>
        </div>
        <!-- /.col -->
      </div>
    </div>
    <!-- /.login-card-body -->
  </div>
</div>
<!-- /.login-box -->

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script>
    const DEFAULT_STUDENT = "88888888-8888-8888-8888-888888888888";
    const DEFAULT_ADMIN = "ADMIN-123";

    function autoFill() {
        const role = document.getElementById('userRole').value;
        if(role === 'student') {
            document.getElementById('userId').value = DEFAULT_STUDENT;
        } else {
            document.getElementById('userId').value = DEFAULT_ADMIN;
        }
    }

    function login() {
        const role = document.getElementById('userRole').value;
        const userId = document.getElementById('userId').value;

        if(!userId) {
            alert("Vui lòng nhập ID!");
            return;
        }

        localStorage.setItem('fake_user_id', userId);
        localStorage.setItem('fake_user_role', role);

        if(role === 'student') {
            window.location.href = '/student';
        } else {
            window.location.href = '/admin';
        }
    }

    // Auto fill on load
    autoFill();
</script>
</body>
</html>
