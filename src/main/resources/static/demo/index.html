<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registration Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">
      <h1 class="text-2xl font-bold mb-4">Demo: Đăng ký học phần</h1>

      <div class="grid grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium">Student</label>
          <select id="studentSelect" class="mt-1 block w-full border rounded p-2"></select>
        </div>
        <div>
          <label class="block text-sm font-medium">Academic Year</label>
          <select id="academicSelect" class="mt-1 block w-full border rounded p-2"></select>
        </div>
        <div>
          <label class="block text-sm font-medium">Semester / Period</label>
          <select id="periodSelect" class="mt-1 block w-full border rounded p-2"></select>
        </div>
      </div>

      <div class="mb-4">
        <h2 class="text-lg font-semibold">Available Course Classes</h2>
        <div id="classes" class="grid grid-cols-1 gap-3 mt-2"></div>
      </div>

      <div class="mt-4">
        <h2 class="text-lg font-semibold">My Registrations</h2>
        <div id="myRegs" class="mt-2"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
